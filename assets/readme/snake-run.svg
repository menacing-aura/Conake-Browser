    <text x="35" y="105" fill="#fff1f8" font-family="Arial, sans-serif" font-size="55" font-weight="900" letter-spacing="-2">OFFLINE.</text>
    <text x="35" y="160" fill="#ff719c" font-family="Arial, sans-serif" font-size="55" font-weight="900" letter-spacing="-2">ON A RUN.</text>
    <text x="38" y="196" fill="#cba8c1" font-family="Arial, sans-serif" font-size="17">Jump crystals. Duck drones. Chase your best.</text>
