<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="282" viewBox="0 0 1200 282" role="img" aria-labelledby="title desc">
  <title id="title">Snake Run — Offline. On a run.</title>
  <desc id="desc">A crimson snake jumps crystal spikes under an eclipse. Jump crystals, duck drones, and chase your best in Conake's bundled offline runner.</desc>
  <defs>
    <linearGradient id="night" x2="1" y2=".3"><stop stop-color="#2d1127"/><stop offset="1" stop-color="#110c1b"/></linearGradient>
    <linearGradient id="snake" x2="1" y2=".5"><stop stop-color="#9a225c"/><stop offset=".6" stop-color="#ff4b81"/><stop offset="1" stop-color="#ffacc9"/></linearGradient>
    <linearGradient id="crystal" x2=".7" y2="1"><stop stop-color="#ffa6cd"/><stop offset=".45" stop-color="#b13a86"/><stop offset="1" stop-color="#3c174d"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="282" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
