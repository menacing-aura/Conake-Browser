    <path d="M740 166c33 4 26-31 62-29 36 2 28 36 64 29 36-7 28-63 65-67 36-4 49 22 86 11" fill="none" stroke="#5d1744" stroke-width="28" stroke-linecap="round" transform="translate(0 5)"/>
    <path d="M740 166c33 4 26-31 62-29 36 2 28 36 64 29 36-7 28-63 65-67 36-4 49 22 86 11" fill="none" stroke="url(#snake)" stroke-width="22" stroke-linecap="round" stroke-dasharray="9 3"/>
