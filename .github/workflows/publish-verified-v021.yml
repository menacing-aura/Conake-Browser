name: Publish verified Site Shield installers
on:
  push:
    branches: [ops/publish-desktop-v021]
permissions:
  contents: write
concurrency:
  group: conake-public-v021
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'menacing-aura/Conake-Browser'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish the installer-only release
        env:
          GH_TOKEN: ${{ github.token }}
          CONAKE_PUBLIC_TARGET: 6b630d937989d55cc9d627370dd4ff9de7203398
        run: python3 .github/publish-verified-v021.py
