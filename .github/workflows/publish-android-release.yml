name: Publish Android preview release

on:
  push:
    paths:
      - ".github/workflows/publish-android-release.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish existing Android draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PATCH \
            repos/${{ github.repository }}/releases/449463935 \
            -F draft=false \
            -F prerelease=true
